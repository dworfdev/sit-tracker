<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Steam Inventory Tracker - Stable Metrics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* noinspection CssUnresolvedCustomProperty */
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #0088cc);
            --accent-green: #4caf50;
            --accent-red: #f44336;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .portfolio-summary {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .analytics-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .metric-block {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            color: var(--hint-color);
            font-size: 10px;
            text-transform: uppercase;
        }

        .metric-value {
            font-weight: 600;
            margin-top: 2px;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--button-color); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin: 0; font-size: 18px;">Portfolio Analytics</h2>
    <span id="user-tier" style="font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1);">PRO TIER</span>
</div>

<div class="portfolio-summary">
    <div style="font-size: 12px; color: var(--hint-color);">TOTAL ASSET VALUE</div>
    <div id="portfolio-total" style="font-size: 26px; font-weight: bold; color: var(--accent-green);">$0.00</div>

    <div class="summary-row">
        <div>
            <div style="font-size: 10px; color: var(--hint-color);">ESTIMATED ROI</div>
            <div id="portfolio-roi" style="font-size: 14px; font-weight: bold;" class="positive">+12.45%</div>
        </div>
        <div>
            <div style="font-size: 10px; color: var(--hint-color);">MONITORED ITEMS</div>
            <div id="monitored-count" style="font-size: 14px; font-weight: bold;">0 / 3</div>
        </div>
    </div>
</div>

<div id="inventory-container" class="inventory-grid"></div>

<script src="js/app.js"></script>
</body>
</html>
